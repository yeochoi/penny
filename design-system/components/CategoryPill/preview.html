<div style="font-family:var(--font-sans);background:var(--bg);color:var(--ink);padding:16px;width:340px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
<span class="caption" style="height:48px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center">Groceries</span>
<span class="caption" style="height:48px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center">Eating out</span>
<span class="caption" style="height:48px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center">Home</span>
<span class="caption" style="height:48px;border-radius:999px;background:var(--soft);color:var(--gold-text);font-weight:500;box-shadow:inset 0 0 0 1.5px var(--gold-line);display:flex;align-items:center;justify-content:center">Transport</span>
</div>
