<!-- @dsCard group="Charts" height=230 -->
<div style="font-family:var(--font-sans);background:var(--bg);color:var(--ink);padding:16px;width:340px">
<div style="border-radius:28px;background:var(--surface);padding:22px 22px 16px">
<div style="height:140px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:end">
<div style="height:118px;border-radius:999px;background:var(--track)"></div><div style="height:113px;border-radius:999px;background:var(--track)"></div><div style="height:109px;border-radius:999px;background:var(--track)"></div><div style="height:107px;border-radius:999px;background:var(--track)"></div><div style="height:103px;border-radius:999px;background:var(--track)"></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span class="caption" style="color:var(--gold-text);font-weight:500;white-space:nowrap">So far</span><div style="width:100%;height:88px;border-radius:999px;background:var(--primary)"></div></div>
</div>
<div class="caption" style="margin-top:10px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;text-align:center;color:var(--muted)"><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span style="color:var(--ink);font-weight:500">Nov</span></div>
</div></div>
