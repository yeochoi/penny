<!-- @dsCard height=300 -->
<style>
.cv{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
.cv svg{position:absolute;left:480px;top:0}
.cv .surface{fill:var(--surface)} .cv .gold{fill:var(--primary)} .cv .soft{fill:var(--soft)} .cv .track{fill:var(--track)}
.txt{position:absolute;left:40px;bottom:36px;max-width:440px}
.nm{margin:0;font-size:120px;line-height:.92;font-weight:300;letter-spacing:-0.03em;color:var(--ink)}
.tg{margin:12px 0 0;font-size:14px;line-height:20px;color:var(--muted)}
</style>
<div class="cv">
<svg width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
  <rect class="surface" x="20" y="-28" width="400" height="356" rx="28"></rect>
  <rect class="soft" x="330" y="-28" width="200" height="160" rx="28"></rect>
  <circle class="gold" cx="330" cy="132" r="64"></circle>
  <rect class="track" x="56" y="110" width="28" height="170" rx="14"></rect>
  <rect class="track" x="112" y="128" width="28" height="152" rx="14"></rect>
  <rect class="track" x="168" y="146" width="28" height="134" rx="14"></rect>
  <rect class="track" x="224" y="164" width="28" height="116" rx="14"></rect>
  <rect class="track" x="280" y="200" width="28" height="80" rx="14"></rect>
  <rect class="gold" x="336" y="224" width="28" height="56" rx="14"></rect>
</svg>
<div class="txt"><h1 class="nm">Penny</h1><p class="tg">Spend a little less each month.</p></div>
</div>
